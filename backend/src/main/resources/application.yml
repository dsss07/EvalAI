spring:
    rabbitmq:
        addresses: $
        listener:
            simple:
                retry:
                    enabled: true
                    initial-interval: 2000ms
                    multiplier: 2.0

    application:
        name: ai-answer-evaluator

    mail:
        host: ${SPRING_MAIL_HOST:localhost}
        port: ${SPRING_MAIL_PORT:587}
        username: ${SPRING_MAIL_USERNAME:}
        password: ${SPRING_MAIL_PASSWORD:}
        properties:
            mail:
                smtp:
                    auth: ${SPRING_MAIL_SMTP_AUTH:true}
                    starttls:
                        enable: ${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/answer_eval}
        username:
        password:
        driver-class-name: org.postgresql.Driver

    jpa:
        hibernate:
            ddl-auto: update
        open-in-view: false
        properties:
            hibernate:
                format_sql: true

    servlet:
        multipart:
            max-file-size: 25MB
            max-request-size: 100MB

    jackson:
        property-naming-strategy: SNAKE_CASE
        mapper:
            accept-case-insensitive-enums: true

    ai:
        model:
            chat: google-genai
        google:
            genai:
                api-key: ${GEMINI_API_KEY}
                chat:
                    model: ${GEMINI_MODEL:gemini-3.1-flash-lite}
                    temperature: 0.1
                    response-mime-type: application/json

server:
    port: ${PORT:8082}

app:
    frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
    cors:
        allowed-origins: http://localhost:5173

    uploads:
        directory: ${UPLOAD_DIRECTORY:./uploads}

    python-service:
        base-url: ${PYTHON_SERVICE_URL:http://localhost:8001}

    jwt:
        secret: ${JWT_SECRET:dev-only-secret-key-change-this-to-a-long-random-secret-123456789}
        access-expiration-minutes: 60
        refresh-expiration-days: 7

management:
    endpoints:
        web:
            exposure:
                include: health,info
